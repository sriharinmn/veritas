name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # The brief says "keep credentials out of the repository". This is how we
      # know, rather than how we hope.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # `ruff check` only. The formatter is deliberately not enforced: it wants
      # to explode compact, hand-laid-out literals — a 28-word stop list, the
      # rate-limit table, the JSON schemas — into one item per line, which makes
      # them materially harder to read for no correctness gain. The linter is
      # the half that finds bugs, and it has: an undefined name on the entity
      # fallback's own recovery path, and a fire-and-forget asyncio task with no
      # strong reference.
      - name: lint
        run: ruff check .
      - name: types
        run: mypy core api
      # No API keys in CI. Every LLM interaction in the test suite runs against
      # recorded fixtures, so the pipeline is verifiable by anyone who forks it.
      - name: tests
        run: pytest --cov=core --cov-report=term-missing

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

  compose:
    name: docker compose boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The single most important claim in the README is "docker compose up
      # works". It is worth proving on every commit.
      - run: cp .env.example .env
      - run: docker compose build
      # `api` alone — there is no `db` service. Postgres was removed when it
      # turned out nothing ever connected to it (see docs/adr/0001), and this
      # line was not updated with it, so the one check that proves the README's
      # central claim had been failing on every commit since.
      - run: docker compose up -d api
      - name: wait for the api to answer
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          docker compose logs
          exit 1
      - run: docker compose down -v
