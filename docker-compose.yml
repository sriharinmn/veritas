# Veritas — the entire setup instruction is `docker compose up`.
#
# Boots with a pre-computed knowledge layer over the six starter PDFs.
# No API key, no GPU, no model downloads. See .env.example to go live.
#
# There is no database here, and that is a decision rather than an omission.
# An earlier version ran Postgres with pgvector; nothing ever connected to it.
# The knowledge layer is built from append-only JSONL checkpoints, which at six
# documents and eleven thousand claims is genuinely enough — and shipping a
# database that nothing opens is worse than shipping none, because a reader has
# to work out for themselves that it does nothing. See docs/adr/0001.
#
# There is no ollama service in the default stack either: GPU passthrough into
# containers is fragile on Windows and would become a setup step you have to
# follow. Ollama runs natively on your host if you want it, and the API reaches
# it at host.docker.internal:11434. See docs/adr/0002.
#
#   docker compose up                      the whole app, no key, no GPU
#   docker compose --profile ollama up     adds a CPU-only Ollama (slow; read below)

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: [.env]
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      WEB_PORT: ${WEB_PORT:-3000}
      VERITAS_ROLE: api
    volumes:
      - ./seed:/app/seed:ro
      # The checkpoints are the store. Mounted read-write so an upload made in
      # the browser survives the container being recreated.
      - ./evals/corpus:/app/evals/corpus
      - storage:/app/storage
    ports:
      - "${API_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so Linux hosts match Windows/macOS
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 768m

  # Optional, and off by default: `docker compose --profile ollama up`.
  #
  # Read this before enabling it. Without GPU passthrough — which is what you
  # get on Windows and macOS — qwen3:8b runs on CPU at roughly three tokens a
  # second, which is about ten minutes per page instead of ninety seconds. It
  # will look like the application has hung. It has not; it is thinking, slowly.
  #
  # If you want the local tier, installing Ollama natively is strictly better:
  # it uses your GPU, and `make ollama` pulls the model for you. This service
  # exists for Linux hosts with the NVIDIA container toolkit, and for anyone who
  # would rather spend wall-clock than install anything.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        limits:
          memory: 8g

volumes:
  storage:
  ollama:
