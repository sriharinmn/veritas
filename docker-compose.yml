# Veritas — the entire setup instruction is `docker compose up`.
#
# Boots with a pre-computed knowledge layer over the six starter PDFs.
# No API key, no GPU, no model downloads. See .env.example to go live.
#
# Note there is no `ollama` service here, deliberately: GPU passthrough into
# containers is fragile on Windows and would become a setup step you have to
# follow. Ollama runs natively on your host if you want it, and the worker
# reaches it at host.docker.internal:11434. See docs/adr/0002.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: veritas
      POSTGRES_PASSWORD: veritas
      POSTGRES_DB: veritas
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veritas -d veritas"]
      interval: 3s
      timeout: 3s
      retries: 20
    # The host has 16 GB shared with WSL2, a browser and possibly Ollama.
    # This workload is thousands of rows, not millions — it does not need more.
    deploy:
      resources:
        limits:
          memory: 768m

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://veritas:veritas@db:5432/veritas
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      VERITAS_ROLE: api
    volumes:
      - ./seed:/app/seed:ro
      - storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # so Linux hosts match Windows/macOS
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["python", "-m", "core.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://veritas:veritas@db:5432/veritas
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      VERITAS_ROLE: worker
    volumes:
      - ./seed:/app/seed:ro
      - storage:/app/storage
    depends_on:
      db: {condition: service_healthy}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2g

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  dbdata:
  storage:
